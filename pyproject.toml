[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imagetochaste"
version = "0.2.3"
description = "Automated cell segmentation from microscopy scans via SAM 2 into Chaste C++ simulation meshes"
readme = "README.md"
authors = [
    { name = "Proshanto Chanda", email = "proshanto.chanda@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "computational-biology",
    "cell-segmentation",
    "sam2",
    "segment-anything",
    "chaste",
    "mesh-generation",
    "biophysics",
    "microscopy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "Pillow>=9.5.0",
    "opencv-python-headless>=4.7.0",
    "scikit-image>=0.20.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0"
]
sam2 = [
    "torch>=2.0.0",
    "torchvision>=0.15.0"
]
all = [
    "imagetochaste[dev,sam2]"
]

[project.scripts]
imagetochaste = "imagetochaste.cli:main"

[project.urls]
Homepage = "https://github.com/proshanto-c/ImageToChaste"
Repository = "https://github.com/proshanto-c/ImageToChaste.git"
Documentation = "https://github.com/proshanto-c/ImageToChaste#readme"
"Bug Tracker" = "https://github.com/proshanto-c/ImageToChaste/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["imagetochaste*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "legacy",
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F401", "E402", "I001"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
